plugins { id 'com.android.application' }

def ghostKeystore = providers.environmentVariable('GHOST_KEYSTORE').orNull

android {
    namespace 'com.vertex.ghost'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.vertex.ghost'
        minSdk 34
        targetSdk 36
        versionCode 8
        versionName '1.1.0-preview.1'
    }

    signingConfigs {
        if (ghostKeystore) {
            originalDebug {
                storeFile file(ghostKeystore)
                storePassword providers.environmentVariable('GHOST_STORE_PASSWORD').getOrElse('android')
                keyAlias providers.environmentVariable('GHOST_KEY_ALIAS').getOrElse('androiddebugkey')
                keyPassword providers.environmentVariable('GHOST_KEY_PASSWORD').getOrElse('android')
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            if (ghostKeystore) signingConfig signingConfigs.originalDebug
        }
    }

    buildFeatures {
        aidl true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
